<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HabitForge Pro | Gamified Tracker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { 
                        background: 'var(--bg-main)',
                        surface: 'var(--bg-surface)',
                        surfaceHighlight: 'var(--bg-highlight)',
                        border: 'var(--border-color)',
                        textMain: 'var(--text-main)',
                        textMuted: 'var(--text-muted)',
                        primary: '#8b5cf6',
                        secondary: '#ec4899',
                        accent: '#3b82f6',
                        success: '#10b981',
                        warning: '#f59e0b',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'grow-v': 'growV 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        growV: { '0%': { height: '0%' }, '100%': { height: 'var(--target-h)' } }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-main: #f4f4f5;
            --bg-surface: #ffffff;
            --bg-highlight: #e4e4e7;
            --border-color: #d4d4d8;
            --text-main: #18181b;
            --text-muted: #71717a;
        }

        html.dark {
            --bg-main: #09090b;
            --bg-surface: #18181b;
            --bg-highlight: #27272a;
            --border-color: #3f3f46;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        html, body { height: 100%; width: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .glass-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .dark .glass-card {
            border-color: rgba(255,255,255,0.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .mesh-gradient {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            filter: blur(60px);
            opacity: 0.8;
        }
        html:not(.dark) .mesh-gradient { opacity: 0.4; filter: blur(80px); }

        .input-field {
            background: var(--bg-highlight);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 100%; padding: 0.75rem; border-radius: 0.75rem; outline: none;
            transition: border-color 0.2s, background-color 0.3s;
        }
        .input-field:focus { border-color: theme('colors.primary'); }
        .input-field[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
        .dark .input-field[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .modal-backdrop {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            width: 90%; max-width: 500px; max-height: 85vh;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            display: flex; flex-direction: column;
            transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .modal-backdrop.active .modal-content { transform: scale(1); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
        .calendar-day {
            aspect-ratio: 1/1; border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 600; background: var(--bg-highlight); color: var(--text-muted);
            cursor: pointer; transition: all 0.2s;
        }
        .calendar-day.done { background: theme('colors.primary'); color: white; }
        
        .heatmap-box { aspect-ratio: 1/1; border-radius: 4px; transition: transform 0.2s; }
        .heatmap-box:hover { transform: scale(1.2); z-index: 10; }
        .heatmap-box.empty { background-color: var(--bg-highlight); }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 12px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100; opacity: 0; pointer-events: none; transition: all 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>

        import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, deleteDoc, query, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // !!! REPLACE WITH YOUR OWN KEYS !!!

        const firebaseConfig = {

            authDomain: "habit-7583c.firebaseapp.com",

        const store = {

            habits: [],
            settings: {
                tiers: [
                    { days: 3, label: 'Spark', color: '#fbbf24' },
                    { days: 7, label: 'Flame', color: '#f97316' },

                { id: 'emerald', hex: '#10b981' },

            ],
            currentTab: 'dashboard',

            viewingHabitId: null,
            xp: 0,
            notifiedTimes: new Set(),
            dailyInsights: [
                { icon: 'ph-leaf', text: 'Momentum starts now.' },
                { icon: 'ph-sparkle', text: 'Consistency is key.' },
                { icon: 'ph-brain', text: 'You are what you repeatedly do.' },
                { icon: 'ph-target', text: 'Focus on the process.' },
                { icon: 'ph-crown', text: 'Small steps, big changes.' },
            ]
        };

        const getTodayDate = () => {
            const offset = new Date().getTimezoneOffset() * 60000;
            return new Date(Date.now() - offset).toISOString().split('T')[0];
        };

        const helpers = {
            toast: (msg, type = 'success') => {
                const el = document.getElementById('toast');
                const txt = document.getElementById('toast-msg');
                const icon = document.getElementById('toast-icon');
                txt.innerText = msg;
                icon.className = type === 'error' ? "ph-fill ph-warning-circle text-red-500 text-xl" : "ph-fill ph-check-circle text-green-500 text-xl";
                el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 3000);
            },
            confetti: () => {
                const container = document.getElementById('confetti-container');
                if(!container) return; // Safety check
                const colors = ['#8b5cf6', '#ec4899', '#3b82f6', '#f59e0b'];
                for(let i=0; i<50; i++) {
                    const el = document.createElement('div');
                    el.style.position = 'absolute';
                    el.style.width = '8px'; el.style.height = '8px';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.left = '50%'; el.style.top = '50%';
                    el.style.borderRadius = '2px';
                    container.appendChild(el);
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 5 + Math.random() * 15;
                    const tx = Math.cos(angle) * velocity * 20;
                    const ty = Math.sin(angle) * velocity * 20;
                    el.animate([
                        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                        { transform: `translate(${tx}px, ${ty}px) rotate(720deg)`, opacity: 0 }
                    ], { duration: 1000 + Math.random() * 500, easing: 'cubic-bezier(0.25, 1, 0.5, 1)' })
                    .onfinish = () => el.remove();
                }
                helpers.toast("Goal Achieved!", "success");
            },
            calculateStreak: (habit) => {
                if (!habit.completions) return 0;
                const today = getTodayDate();
                const yesterday = new Date(new Date(today).getTime() - 86400000).toISOString().split('T')[0];
                let streak = 0;
                let d = new Date(today);
                
                if (!habit.completions[today] && !habit.completions[yesterday]) return 0;

                for(let i=0; i<365; i++) {
                    const dateStr = d.toISOString().split('T')[0];
                    if ((habit.completions[dateStr] || 0) >= (habit.target || 1)) {
                        streak++;
                        d.setDate(d.getDate() - 1);
                    } else if (dateStr === today) {
                         d.setDate(d.getDate() - 1);
                    } else {
                        break;
                    }
                }
                return streak;
            },
            getCompletionStats: (habits) => {
                const dailyStats = {};
                let totalHabitDays = 0;
                let completedSum = 0;
                for (let i = 0; i < 30; i++) {
                    const date = new Date(new Date(getTodayDate()).getTime() - i * 86400000);
                    const dateStr = date.toISOString().split('T')[0];
                    let total = 0, completed = 0;
                    habits.forEach(h => {
                        total++;
                        if ((h.completions?.[dateStr] || 0) >= (h.target || 1)) completed++;
                    });
                    dailyStats[dateStr] = { total, completed };
                    if(total > 0) {
                        totalHabitDays++;
                        completedSum += (completed/total);
                    }
                }
                return { avgPercentage: totalHabitDays ? Math.round((completedSum / totalHabitDays) * 100) : 0, daily: dailyStats };
            },
            checkReminders: () => {
                const now = new Date();
                const currentHour = now.getHours().toString().padStart(2, '0');
                const currentMinute = now.getMinutes().toString().padStart(2, '0');
                const currentTime = `${currentHour}:${currentMinute}`;

                store.habits.forEach(h => {
                    if(h.reminderTime === currentTime) {
                        const key = `${h.id}-${currentTime}`;
                        if(!store.notifiedTimes.has(key)) {
                            store.notifiedTimes.add(key);
                            if(Notification.permission === 'granted') {
                                const notif = new Notification(`Time for ${h.title}!`, {
                                    body: 'Click here to mark this habit as done.',
                                    requireInteraction: true
                                });
                                notif.onclick = () => {
                                    window.app.toggleHabit(h.id);
                                    notif.close();
                                    window.focus();
                                };
                            }
                        }
                    }
                });
            }
        };

        const render = {
            init: () => {
                const loader = document.getElementById('loading-overlay');
                if(authReady) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.classList.add('hidden'), 500);
                }

                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                render.nav();
                if(store.currentTab === 'dashboard') render.dashboard();
                else render.stats();

            nav: () => {
                document.querySelectorAll('.nav-item').forEach(el => {
                    const active = el.dataset.tab === store.currentTab;
                    el.className = `nav-item flex-1 flex flex-col items-center gap-1 p-2 rounded-xl transition-colors ${active ? 'text-violet-500 bg-surfaceHighlight' : 'text-textMuted'}`;
                    el.querySelector('i').classList.toggle('ph-fill', active);
                    el.querySelector('i').classList.toggle('ph-bold', !active);
                });
                document.querySelectorAll('.nav-item-d').forEach(el => {
                    const active = el.dataset.tab === store.currentTab;
                    if(active) {
                        el.className = "nav-item-d w-10 h-10 rounded-xl flex items-center justify-center text-violet-500 bg-violet-500/10 ring-1 ring-violet-500/20";
                        el.querySelector('i').classList.replace('ph-bold', 'ph-fill');
                    } else {
                        el.className = "nav-item-d w-10 h-10 rounded-xl flex items-center justify-center text-textMuted hover:text-primary hover:bg-surfaceHighlight transition-colors";
                        el.querySelector('i').classList.replace('ph-fill', 'ph-bold');
                    }
                });
            },

            dashboard: () => {
                const main = document.getElementById('main-content');
                const todayInsight = store.dailyInsights[new Date().getDate() % store.dailyInsights.length];
                const today = getTodayDate();
                
                let completedToday = 0;
                store.habits.forEach(h => {
                    if ((h.completions?.[today] || 0) >= (h.target || 1)) completedToday++;
                });
                const dailyProgress = store.habits.length === 0 ? 0 : (completedToday / store.habits.length) * 100;

                let html = `
                    <div class="mb-6 glass-card p-5 rounded-2xl relative overflow-hidden animate-fade-in">
                        <div class="absolute inset-0 bg-gradient-to-r from-violet-500/10 to-fuchsia-500/10 z-0 transition-all duration-1000 ease-out" style="width: ${dailyProgress}%"></div>
                        <div class="absolute bottom-0 left-0 h-1 bg-gradient-to-r from-violet-500 to-fuchsia-500 transition-all duration-1000 ease-out" style="width: ${dailyProgress}%"></div>
                        <div class="flex items-start gap-4 relative z-10">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl bg-violet-500/10 text-violet-500 shrink-0">
                                <i class="ph-fill ${todayInsight.icon}"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-bold mb-1">Today's Insight</h2>
                                <p class="text-sm text-textMuted leading-snug">${todayInsight.text}</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-end mb-4">
                        <h3 class="text-lg font-bold">Your Habits</h3>
                        <button onclick="app.openModal('ai-modal')" class="px-3 py-1.5 bg-fuchsia-500/10 hover:bg-fuchsia-500/20 border border-fuchsia-500/20 rounded-lg text-xs font-bold text-fuchsia-500 flex items-center gap-1.5 transition-colors">
                            <i class="ph-bold ph-sparkle"></i> AI Assistant
                        </button>
                    </div>
                    <div class="space-y-3 pb-20">`;

                if(store.habits.length === 0) {
                    html += `
                        <div class="py-16 border-2 border-dashed border-border rounded-2xl flex flex-col items-center justify-center text-center text-textMuted bg-surfaceHighlight/20">
                            <i class="ph-duotone ph-plant text-5xl mb-3 opacity-50"></i>
                            <p class="font-medium">No habits yet.</p>
                            <p class="text-xs mt-1">Click the + button to start your journey.</p>
                        </div>`;
                } else {
                    store.habits.forEach(h => {
                        const doneCount = h.completions?.[today] || 0;
                        const target = h.target || 1;
                        const isDone = doneCount >= target;
                        const colorHex = store.colors.find(c => c.id === h.color)?.hex || '#8b5cf6';
                        const streak = helpers.calculateStreak(h);
                        const progress = Math.min((doneCount / target) * 100, 100);
                        
                        let toggleButton;
                        if (h.type === 'numeric') {
                            toggleButton = `
                                <input type="number" onchange="app.setNumericValue('${h.id}', this.value)" value="${doneCount}" min="0" class="w-14 h-10 input-field text-center text-sm font-bold p-0" onclick="event.stopPropagation()">
                            `;
                        } else {
                            toggleButton = `
                                <button onclick="event.stopPropagation(); app.toggleHabit('${h.id}')" class="w-11 h-11 rounded-xl flex items-center justify-center transition-all active:scale-90 shadow-sm" style="${isDone ? `background: ${colorHex}; color: white; box-shadow: 0 4px 12px ${colorHex}60;` : 'background: var(--bg-highlight); color: var(--text-muted);'}">
                                    ${isDone ? '<i class="ph-bold ph-check text-xl"></i>' : (h.target > 1 ? `<span class="text-xs font-bold">${doneCount}/${target}</span>` : '<i class="ph-bold ph-check text-xl opacity-20"></i>')}
                                </button>
                            `;
                        }
                        
                        html += `
                        <div class="group relative glass-card p-4 rounded-2xl transition-all overflow-hidden animate-slide-up hover:translate-y-[-2px]">
                            <div class="absolute bottom-0 left-0 h-1 bg-surfaceHighlight w-full">
                                <div class="h-full transition-all duration-500" style="width: ${progress}%; background-color: ${colorHex}"></div>
                            </div>
                            <div class="flex items-center gap-4">
                                <div onclick="app.editHabit('${h.id}')" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0 cursor-pointer" style="background: ${colorHex}15; color: ${colorHex};">

                                </div>
                                <div class="flex-1 min-w-0" onclick="app.editHabit('${h.id}')">
                                    <h4 class="font-bold truncate text-base ${isDone ? 'line-through opacity-50' : ''}">${h.title}</h4>
                                    <div class="flex items-center gap-3 mt-1 text-xs font-medium text-textMuted">
                                        <span class="flex items-center gap-1 ${streak > 0 ? 'text-warning' : ''}"><i class="ph-fill ph-fire"></i> ${streak}d</span>
                                        ${h.reminderTime ? `<span class="flex items-center gap-1"><i class="ph-bold ph-clock"></i> ${h.reminderTime}</span>` : ''}
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="app.openCalendar('${h.id}')" class="w-9 h-9 rounded-lg flex items-center justify-center text-textMuted hover:text-primary hover:bg-surfaceHighlight transition-colors">
                                        <i class="ph-bold ph-calendar-blank text-lg"></i>
                                    </button>
                                    ${toggleButton}
                                </div>
                            </div>
                        </div>`;
                    });
                }
                html += `</div>`;
                main.innerHTML = html;
            },

            stats: () => {
                const main = document.getElementById('main-content');
                const bestStreak = store.habits.reduce((max, h) => Math.max(max, helpers.calculateStreak(h)), 0);
                const completionRates = helpers.getCompletionStats(store.habits);

                const days = Array.from({ length: 30 }, (_, i) => i);
                let heatmapHTML = days.map(i => {
                    const date = new Date(new Date(getTodayDate()).getTime() - (29 - i) * 86400000);
                    const dateStr = date.toISOString().split('T')[0];
                    const dayData = completionRates.daily[dateStr] || { total: 0, completed: 0 };
                    const intensity = dayData.total > 0 ? (dayData.completed / dayData.total) : 0;
                    let colorClass = 'heatmap-box empty';
                    if (intensity > 0 && intensity <= 0.25) colorClass = 'heatmap-box bg-violet-500/30';
                    else if (intensity > 0.25 && intensity <= 0.5) colorClass = 'heatmap-box bg-violet-500/50';
                    else if (intensity > 0.5 && intensity <= 0.75) colorClass = 'heatmap-box bg-violet-500/70';
                    else if (intensity > 0.75) colorClass = 'heatmap-box bg-violet-500';
                    return `<div class="${colorClass}" title="${dateStr}: ${Math.round(intensity*100)}%"></div>`;
                }).join('');

                const last7Days = Array.from({length: 7}, (_, i) => {
                    const d = new Date(getTodayDate());
                    d.setDate(d.getDate() - (6-i));
                    return d.toISOString().split('T')[0];
                });
                
                let weeklyChartHtml = last7Days.map(dateStr => {
                    const data = completionRates.daily[dateStr] || { total: 1, completed: 0 };
                    const pct = data.total > 0 ? (data.completed / data.total) * 100 : 0;
                    const dayName = new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short' }).slice(0,1);
                    return `
                        <div class="flex flex-col items-center justify-end h-24 w-full gap-2">
                            <div class="w-full bg-surfaceHighlight rounded-t-md relative overflow-hidden flex-1 flex items-end">
                                <div class="w-full bg-violet-500 rounded-t-sm animate-grow-v" style="--target-h: ${pct}%"></div>
                            </div>
                            <span class="text-[10px] font-bold text-textMuted uppercase">${dayName}</span>
                        </div>
                    `;

                let habitsListHtml = store.habits.map(h => {
                    const colorHex = store.colors.find(c => c.id === h.color)?.hex || '#8b5cf6';

                                <div class="w-10 h-10 rounded-lg flex items-center justify-center text-lg" style="background: ${colorHex}15; color: ${colorHex}">

                                </div>

                                    <div class="font-bold text-sm">${h.title}</div>

                                </div>

                            <i class="ph-bold ph-caret-right text-textMuted"></i>
                        </div>
                    `;
                }).join('');

                let tiersHtml = store.settings.tiers.map(t => {
                    const unlockedCount = store.habits.filter(h => helpers.calculateStreak(h) >= t.days).length;
                    return `
                        <div class="glass-card p-3 rounded-xl flex flex-col items-center gap-2 ${unlockedCount > 0 ? 'opacity-100' : 'opacity-40 grayscale'}">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-lg" style="background: ${t.color}">${unlockedCount}</div>
                            <div class="text-center">
                                <div class="text-[10px] font-bold uppercase tracking-wide">${t.label}</div>
                                <div class="text-[9px] text-textMuted font-mono">${t.days} Days</div>
                            </div>
                        </div>`;
                }).join('');

                main.innerHTML = `
                    <div class="space-y-6 animate-fade-in max-w-2xl mx-auto">
                        <h2 class="text-2xl font-bold">Statistics</h2>
                        <div class="glass-card p-5 rounded-2xl">
                            <h3 class="text-xs font-bold text-textMuted uppercase mb-4 flex items-center gap-2"><i class="ph-bold ph-chart-bar"></i> Last 7 Days</h3>
                            <div class="flex gap-2 items-end">${weeklyChartHtml}</div>
                        </div>
                        <div class="grid grid-cols-3 gap-3">
                            <div class="glass-card p-4 rounded-2xl text-center">
                                <div class="text-textMuted text-[10px] font-bold uppercase mb-1">Total XP</div>
                                <div class="text-2xl font-bold text-primary">${store.xp}</div>
                            </div>
                            <div class="glass-card p-4 rounded-2xl text-center">
                                <div class="text-textMuted text-[10px] font-bold uppercase mb-1">Consistency</div>
                                <div class="text-2xl font-bold text-accent">${completionRates.avgPercentage}%</div>
                            </div>
                            <div class="glass-card p-4 rounded-2xl text-center">
                                <div class="text-textMuted text-[10px] font-bold uppercase mb-1">Best Streak</div>
                                <div class="text-2xl font-bold text-warning">${bestStreak}d</div>
                            </div>
                        </div>
                        <div class="glass-card p-5 rounded-2xl">
                            <h3 class="text-xs font-bold text-textMuted uppercase mb-4 flex items-center gap-2"><i class="ph-bold ph-squares-four"></i> 30-Day Activity</h3>
                            <div class="max-w-[320px] mx-auto">
                                <div class="grid grid-cols-7 gap-2 mb-2 text-[10px] font-bold text-textMuted text-center opacity-50">
                                    <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                                </div>
                                <div class="grid grid-cols-7 gap-2">${heatmapHTML}</div>
                            </div>
                        </div>
                        <div>
                            <h3 class="text-xs font-bold text-textMuted uppercase mb-3">Habit Performance</h3>
                            <div class="space-y-2">${habitsListHtml}</div>
                        </div>
                        <div>
                            <h3 class="text-xs font-bold text-textMuted uppercase mb-3">Milestone Badges</h3>
                            <div class="grid grid-cols-4 gap-2">${tiersHtml}</div>
                        </div>
                    </div>
                `;

            calendar: (habitId) => {
                const h = store.habits.find(x => x.id === habitId);

                const grid = document.getElementById('calendar-grid');
                if (!grid) return;
                grid.innerHTML = '';
                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayIndex = new Date(year, month, 1).getDay();
                for(let i=0; i<firstDayIndex; i++) {
                    const el = document.createElement('div');
                    el.className = 'calendar-day future';
                    grid.appendChild(el);
                }
                for(let i=1; i<=daysInMonth; i++) {
                    const date = new Date(year, month, i);
                    const dateStr = date.toISOString().split('T')[0];
                    const isToday = i === today.getDate();
                    const isFuture = date > today;
                    const doneCount = h.completions?.[dateStr] || 0;
                    const isDone = doneCount >= (h.target || 1);
                    const el = document.createElement('div');
                    el.className = `calendar-day ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''} ${isDone ? 'done' : ''}`;

                    </button>
                `).join('');
            },

            report: (habitId) => {
                const h = store.habits.find(x => x.id === habitId);
                if(!h) return;
                const container = document.getElementById('report-content');
                const completions = h.completions || {};
                const completionDates = Object.keys(completions).sort();
                const total = completionDates.length;
                const streak = helpers.calculateStreak(h);
                const thisMonth = new Date().toISOString().slice(0,7);
                const monthCount = completionDates.filter(d => d.startsWith(thisMonth)).length;
                const freq = [0,0,0,0,0,0,0];
                completionDates.forEach(d => freq[new Date(d).getDay()]++);
                const maxFreq = Math.max(...freq, 1);
                
                const points = [];
                let runningTotal = 0;
                const dates = [];
                const chartWidth = 300;
                const chartHeight = 150;
                const padding = 20;
                const usableHeight = chartHeight - (padding * 2);
                
                for(let i=29; i>=0; i--) {
                    const d = new Date(new Date(getTodayDate()).getTime() - i*86400000);
                    const dStr = d.toISOString().split('T')[0];
                    if(completions[dStr]) runningTotal++;
                    points.push(runningTotal);
                    dates.push(d);
                }
                const maxVal = Math.max(...points, 5);
                
                const pathPoints = points.map((p, i) => {
                    const x = (i / 29) * chartWidth;
                    const y = chartHeight - padding - ((p / maxVal) * usableHeight);
                    return `${x},${y}`;
                });
                
                const areaPath = `M0,${chartHeight} ${pathPoints.map(p => `L${p}`).join(' ')} L${chartWidth},${chartHeight} Z`;
                const strokePath = `M${pathPoints[0]} ${pathPoints.slice(1).map(p => `L${p}`).join(' ')}`;

                const svgCircles = pathPoints.map((p, i) => {
                    const [cx, cy] = p.split(',');
                    return `<circle cx="${cx}" cy="${cy}" r="3" fill="var(--text-main)" />`;
                }).join('');

                const svgLabels = dates.map((d, i) => {
                    if (i % 5 !== 0 && i !== 29) return '';
                    const x = (i / 29) * chartWidth;
                    let anchor = 'middle';
                    if (i === 0) anchor = 'start';
                    if (i === 29) anchor = 'end';
                    return `<text x="${x}" y="${chartHeight - 2}" font-size="10" text-anchor="${anchor}" fill="var(--text-muted)">${d.getDate()}</text>`;
                }).join('');

                const yAxisLabels = `
                    <text x="5" y="${chartHeight - padding}" font-size="10" fill="var(--text-muted)">0</text>
                    <text x="5" y="${chartHeight - padding - (usableHeight/2)}" font-size="10" fill="var(--text-muted)">${Math.round(maxVal/2)}</text>
                    <text x="5" y="${padding + 10}" font-size="10" fill="var(--text-muted)">${maxVal}</text>
                `;

                const grid = [];
                for(let i=180; i>=0; i--) {
                    const d = new Date(new Date(getTodayDate()).getTime() - i*86400000);
                    grid.push({ 
                        date: d.toISOString().split('T')[0], 
                        active: !!completions[d.toISOString().split('T')[0]] 
                    });
                }

                container.innerHTML = `

                    <div class="grid grid-cols-4 gap-2">
                        <div class="glass-card p-3 rounded-xl text-center">

                        </div>
                        <div class="glass-card p-3 rounded-xl text-center">

                        </div>
                        <div class="glass-card p-3 rounded-xl text-center">
                            <div class="text-xs text-textMuted font-bold uppercase">Total</div>
                            <div class="text-xl font-bold">${total}</div>
                        </div>
                        <div class="glass-card p-3 rounded-xl text-center">
                            <div class="text-xs text-textMuted font-bold uppercase">Streak</div>
                            <div class="text-xl font-bold text-warning">${streak}</div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <h4 class="font-bold text-textMuted uppercase text-xs">Accumulated Growth (30 Days)</h4>
                            <span class="text-xs font-bold text-primary">${points[29]} Completions</span>
                        </div>
                        <div class="h-48 glass-card p-4 rounded-xl relative">
                            <svg viewBox="0 0 ${chartWidth} ${chartHeight}" preserveAspectRatio="none" class="w-full h-full">
                                <defs>
                                    <linearGradient id="chartGradient" x1="0" x2="0" y1="0" y2="1">
                                        <stop offset="0%" stop-color="var(--text-main)" stop-opacity="0.2"/>
                                        <stop offset="100%" stop-color="var(--text-main)" stop-opacity="0"/>
                                    </linearGradient>
                                </defs>
                                <path d="${areaPath}" fill="url(#chartGradient)" />
                                <path d="${strokePath}" fill="none" stroke="var(--text-main)" stroke-width="2" />
                                ${svgCircles}
                                ${svgLabels}
                                ${yAxisLabels}
                            </svg>
                        </div>
                    </div>
                    <div>
                        <h4 class="font-bold text-textMuted uppercase text-xs mb-3">Weekly Frequency</h4>
                        <div class="glass-card p-4 rounded-xl">
                            <div class="flex justify-between items-end gap-2 h-32">
                                ${freq.map((count, i) => `
                                    <div class="flex flex-col items-center justify-end h-full w-full gap-2 group">
                                        <span class="text-[10px] font-bold text-primary opacity-0 group-hover:opacity-100 transition-opacity">${count}</span>
                                        <div class="w-full bg-surfaceHighlight rounded-t-md relative overflow-hidden h-full flex items-end">
                                            <div class="w-full bg-primary transition-all duration-500" style="height: ${(count/maxFreq)*100}%"></div>
                                        </div>
                                        <span class="text-[10px] font-bold text-textMuted uppercase">${['S','M','T','W','T','F','S'][i]}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    <div>
                        <h4 class="font-bold text-textMuted uppercase text-xs mb-3">Long-term Heatmap</h4>
                        <div class="glass-card p-4 rounded-xl overflow-x-auto custom-scrollbar">
                            <div class="grid grid-rows-7 grid-flow-col gap-1 w-max">
                                ${grid.map(d => `<div class="w-3 h-3 rounded-sm ${d.active ? 'bg-primary' : 'bg-surfaceHighlight'}"></div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        window.app = {
            switchTab: (tab) => { store.currentTab = tab; render.init(); },
            toggleTheme: () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            },
            openModal: (id) => {
                document.getElementById(id).classList.add('active');
                if(id === 'settings-modal') render.settingsList();
            },
            closeModal: (id) => document.getElementById(id).classList.remove('active'),
            updateModalFrequency: (val) => {
                const group = document.getElementById('goal-input-group');
                const label = {daily: 'Times/Day', weekly: 'Times/Week', monthly: 'Times/Month'}[val];
                const current = document.getElementById('habit-target')?.value || 1;
                group.innerHTML = `<label class="text-xs font-bold uppercase text-textMuted mb-1.5 block">${label}</label><input type="number" id="habit-target" class="input-field" value="${current}" min="1">`;
                const reminders = document.getElementById('reminder-options-group');
                if(val === 'daily') reminders.classList.remove('hidden');
                else reminders.classList.add('hidden');
            },
            openReport: (id) => { store.viewingHabitId = id; render.report(id); app.openModal('report-modal'); },
            openCalendar: (id) => { store.viewingHabitId = id; render.calendar(id); app.openModal('calendar-modal'); },
            toggleHistoryDate: async (id, dateStr) => {
                if (!store.user) return helpers.toast("Sign in to save.", "error");
                const h = store.habits.find(x => x.id === id);
                const target = h.target || 1;
                const current = h.completions?.[dateStr] || 0;
                const next = current >= target ? 0 : target;
                const completions = { ...h.completions };
                if (next > 0) completions[dateStr] = next;
                else delete completions[dateStr];
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', store.user.uid, 'habits', id), { completions });
                } catch (e) { console.error(e); }
            },
            openHabitModal: () => {
                store.editingId = null;
                ['habit-title', 'habit-description', 'habit-time', 'habit-time-window'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.value = '';
                });
                document.getElementById('habit-modal-title').innerText = "Create New Habit";
                document.getElementById('habit-icon').value = 'ph-fire';
                document.getElementById('habit-type').value = 'binary';
                document.getElementById('habit-frequency').value = 'daily';
                app.updateModalFrequency('daily');
                document.getElementById('btn-delete').classList.add('hidden');
                render.colorPicker('violet');
                document.getElementById('color-picker').dataset.selected = 'violet';
                app.openModal('habit-modal');
            },
            editHabit: (id) => {
                app.closeModal('report-modal');
                const h = store.habits.find(x => x.id === id);
                store.editingId = id;
                document.getElementById('habit-modal-title').innerText = "Edit Habit";
                document.getElementById('habit-title').value = h.title;
                document.getElementById('habit-description').value = h.description || '';
                document.getElementById('habit-icon').value = h.icon || 'ph-fire';
                document.getElementById('habit-time').value = h.reminderTime || "";
                document.getElementById('habit-type').value = h.type || 'binary';
                document.getElementById('habit-frequency').value = h.frequency || 'daily';
                document.getElementById('habit-time-window').value = h.timeWindow || '';
                app.updateModalFrequency(h.frequency || 'daily');
                document.getElementById('habit-target').value = h.target || 1;
                document.getElementById('btn-delete').classList.remove('hidden');
                render.colorPicker(h.color || 'violet');
                document.getElementById('color-picker').dataset.selected = h.color || 'violet';
                app.openModal('habit-modal');
            },
            selectColor: (id) => {
                document.getElementById('color-picker').dataset.selected = id;
                render.colorPicker(id);
            },
            setNumericValue: async (id, val) => {
                if (!store.user) return;
                const today = getTodayDate();
                const completions = { [today]: parseInt(val) || 0 };
                await updateDoc(doc(db, 'artifacts', appId, 'users', store.user.uid, 'habits', id), { completions }, { merge: true });
            },
            saveHabit: async () => {
                if (!store.user) return helpers.toast("Wait for connection...", "error");
                const title = document.getElementById('habit-title').value;
                if(!title.trim()) return helpers.toast("Title required", "error");
                const btn = document.getElementById('btn-save-habit');
                btn.disabled = true; btn.innerText = "Saving...";
                const data = {
                    title,
                    description: document.getElementById('habit-description').value,
                    frequency: document.getElementById('habit-frequency').value,
                    target: parseInt(document.getElementById('habit-target').value) || 1,
                    timeWindow: document.getElementById('habit-time-window').value,
                    reminderTime: document.getElementById('habit-time').value,
                    type: document.getElementById('habit-type').value,
                    icon: document.getElementById('habit-icon').value,
                    color: document.getElementById('color-picker').dataset.selected || 'violet',
                    createdAt: new Date().toISOString()
                };
                const id = store.editingId || crypto.randomUUID();
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'users', store.user.uid, 'habits', id), data, { merge: true });
                    helpers.toast("Saved successfully");
                    app.closeModal('habit-modal');
                } catch(e) { helpers.toast("Error saving", "error"); } 
                finally { btn.disabled = false; btn.innerText = "Save Habit"; }
            },
            deleteHabit: async () => {
                if(confirm("Delete this habit?")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', store.user.uid, 'habits', store.editingId));
                    app.closeModal('habit-modal');
                    helpers.toast("Deleted");
                }
            },
            toggleHabit: async (id) => {
                if (!store.user) return;
                const h = store.habits.find(x => x.id === id);
                const today = getTodayDate();
                const current = h.completions?.[today] || 0;
                const target = h.target || 1;
                const next = current >= target ? 0 : target;
                if(next > 0 && current < target) {
                    helpers.confetti();
                    // FIX 2: Use setDoc with merge: true to safely create/update stats
                    setDoc(doc(db, 'artifacts', appId, 'users', store.user.uid, 'stats', 'xp'), { val: increment(10) }, { merge: true });
                }
                const completions = { ...h.completions };
                if(next > 0) completions[today] = next;
                else delete completions[today];
                await updateDoc(doc(db, 'artifacts', appId, 'users', store.user.uid, 'habits', id), { completions });
            },
            requestNotificationPermission: () => {
                Notification.requestPermission().then(p => helpers.toast(p === "granted" ? "Notifications enabled" : "Denied", p === "granted" ? "success" : "error"));
            },
            updateTier: (i, f, v) => store.settings.tiers[i][f] = f === 'days' ? parseInt(v) : v,
            saveSettings: async () => {
                if(store.user) await setDoc(doc(db, 'artifacts', appId, 'users', store.user.uid, 'settings', 'config'), store.settings, { merge: true });
                app.closeModal('settings-modal');
                helpers.toast("Settings saved");
            },
            generateAI: async () => {
                const prompt = document.getElementById('ai-prompt').value;
                if(!prompt) return;
                const btn = document.getElementById('btn-ai-go');
                btn.innerText = "Thinking..."; btn.disabled = true;
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: `As a habit coach, suggest 3 habits for goal: "${prompt}". JSON format: [{"title":"", "type":"binary", "icon":"ph-star"}]` }] }] })
                    });
                    const data = await res.json();
                    let text = data.candidates[0].content.parts[0].text;
                    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const list = JSON.parse(text);
                    document.getElementById('ai-result-step').innerHTML = list.map(h => `
                        <div class="bg-surfaceHighlight p-3 rounded-xl flex justify-between items-center border border-border">
                            <span class="font-bold text-sm">${h.title}</span>
                            <button onclick='app.quickAdd(${JSON.stringify(h)})' class="text-xs font-bold bg-violet-600 text-white px-3 py-1.5 rounded-lg">ADD</button>
                        </div>
                    `).join('');
                    document.getElementById('ai-input-step').classList.add('hidden');
                    document.getElementById('ai-result-step').classList.remove('hidden');
                } catch(e) { console.error(e); helpers.toast("AI Error", "error"); } 
                finally { btn.innerText = "Generate Plan"; btn.disabled = false; }
            },
            quickAdd: async (h) => {
                const id = crypto.randomUUID();
                await setDoc(doc(db, 'artifacts', appId, 'users', store.user.uid, 'habits', id), { ...h, color: 'violet', frequency: 'daily', createdAt: new Date().toISOString() });
                app.closeModal('ai-modal');
                helpers.toast("Added");
            }
        };

        // Initialize App
        window.onload = () => {
            if(!auth) return; // Stop if init failed
            
            onAuthStateChanged(auth, (user) => {
                if(user) {
                    store.user = user;
                    authReady = true;
                    onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'habits')), (snap) => {
                        store.habits = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.createdAt.localeCompare(b.createdAt));
                        render.init();
                        const calModal = document.getElementById('calendar-modal');
                        const repModal = document.getElementById('report-modal');
                        if(calModal.classList.contains('active') && store.viewingHabitId) render.calendar(store.viewingHabitId);
                        if(repModal.classList.contains('active') && store.viewingHabitId) render.report(store.viewingHabitId);
                    });
                    onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'stats', 'xp'), (s) => { if(s.exists()) store.xp = s.data().val; render.init(); });
                    onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'config'), (s) => { if(s.exists()) store.settings = s.data(); });
                    setInterval(helpers.checkReminders, 15000);
                }
            });
            signInAnonymously(auth).catch(e => {
                console.error(e);
                document.getElementById('loading-text').innerText = "Auth Error. Check Console.";
            });
            setTimeout(() => {
                // Fallback to force load UI even if backend is slow (for demo purposes)
                if(!authReady) {
                    document.getElementById('loading-overlay').classList.add('hidden');
                    render.init();
                }
            }, 2500);
        };
    </script>
</body>
</html>
